<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedura placement viewer</title>
    <style>
      :root { color-scheme: light; }
      html, body, #cesium { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
      body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

      #panel {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        width: 310px; max-height: calc(100% - 24px); overflow-y: auto;
        background: rgba(255,255,255,.94); border-radius: 10px;
        box-shadow: 0 2px 14px rgba(0,0,0,.28); padding: 14px 16px;
      }
      #panel h1 { margin: 0 0 2px; font-size: 14px; }
      #panel .sub { color: #6c757d; font-size: 11.5px; margin-bottom: 10px; }
      select, button { font: inherit; width: 100%; padding: 6px 8px; margin-bottom: 8px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      td { padding: 2px 0; vertical-align: top; }
      td:last-child { text-align: right; font-family: ui-monospace, Consolas, monospace; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
               color: #fff; font-weight: 600; font-size: 11px; letter-spacing: .04em; }
      .auto_accept { background: #2f9e44; }
      .review      { background: #f08c00; }
      .reject      { background: #c92a2a; }
      .flags { margin-top: 10px; font-size: 11.5px; color: #495057; }
      .flags li { margin-bottom: 4px; }
      #err { color: #c92a2a; font-size: 12px; }
      .cands { display: flex; gap: 6px; margin: 8px 0; }
      .cands .cand {
        flex: 1; padding: 6px 4px; cursor: pointer; line-height: 1.2;
        border: 1px solid #b9c2cc; border-radius: 4px; background: #fff;
      }
      .cands .cand.chosen { border-color: #1b6ca8; background: #e6f0f7; font-weight: 600; }
      .cands .cand:disabled { opacity: .5; cursor: progress; }
      #choose-status { font-size: 12px; color: #555; }
      .compare {
        display: flex; align-items: center; gap: 8px; margin: 6px 0;
        font-size: 13px;
      }
      .compare button { padding: 2px 8px; }
      #scene { font-size: 12px; color: #444; }
      #scene b { color: #1b6ca8; }
    </style>
  </head>
  <body>
    <div id="cesium"></div>
    <div id="panel">
      <h1>Placement viewer</h1>
      <div class="sub">Scorched Nebraska &middot; VTHacks 14</div>
      <select id="runs"><option>loading…</option></select>
      <button id="fly">Fly to building</button>
      <div class="compare">
        <label><input type="checkbox" id="keep"> keep on map (compare)</label>
        <button id="clear">clear</button>
      </div>
      <div id="scene"></div>
      <div id="meta"></div>
      <div id="err"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
